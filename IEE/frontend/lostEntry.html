<!DOCTYPE html>
<html lang="en" class="h-full bg-vtop-lightBg text-slate-800">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lost Item Entry Portal - IEEE</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        vtop: {
                            blue: '#1e5d9c',
                            darkBlue: '#0f3d6b',
                            accent: '#00a3e0',
                            gold: '#ca8a04',
                            green: '#16a34a',
                            lightBg: '#f0f5fa',
                            cardBg: '#ffffff',
                            inputBg: '#edf3f8'
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    }
                }
            }
        }
    </script>
    
    <style>
        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #e2e8f0;
        }
        ::-webkit-scrollbar-thumb {
            background: #1e5d9c;
            border-radius: 3px;
        }

        /* VTOP Styled Card */
        .vtop-card {
            background: #ffffff;
            border: 1px solid #cbd5e1;
            box-shadow: 0 10px 25px -5px rgba(15, 61, 107, 0.1), 0 8px 10px -6px rgba(15, 61, 107, 0.05);
        }
    </style>
</head>
<body class="bg-vtop-lightBg min-h-screen text-slate-800 font-sans antialiased">

    <!-- NAVIGATION HEADER -->
    <nav class="bg-vtop-darkBlue text-white shadow-md border-b border-vtop-blue/30">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <i class="fa-solid fa-magnifying-glass-location text-2xl text-vtop-accent"></i>
                <span class="text-xl font-extrabold tracking-tight">Lost <span class="text-vtop-accent">& Found</span></span>
            </div>
            <div class="text-xs font-semibold bg-vtop-blue/40 border border-vtop-accent/30 text-sky-100 px-3 py-1.5 rounded-full">
                IEEE Campus Portal
            </div>
        </div>
    </nav>

    <!-- MAIN CONTAINER -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
            
            <!-- FORM SECTION -->
            <div class="lg:col-span-5 vtop-card p-6 sm:p-8 rounded-3xl">
                <div class="mb-6">
                    <h2 class="text-2xl font-extrabold text-vtop-darkBlue flex items-center gap-2.5">
                        <i class="fa-solid fa-circle-plus text-rose-500"></i>
                        Report Lost Item
                    </h2>
                    <p class="text-slate-500 text-xs mt-1 font-medium">Fill out the details below to register a missing belonging.</p>
                </div>

                <form id="lostItemForm" class="space-y-4" onsubmit="handleFormSubmit(event)">
                    
                    <!-- Item Name -->
                    <div>
                        <label for="itemName" class="block text-xs font-bold text-vtop-darkBlue uppercase tracking-wider mb-1">
                            Item Name <span class="text-rose-500">*</span>
                        </label>
                        <input type="text" id="itemName" required
                            class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 bg-vtop-inputBg focus:bg-white focus:outline-none focus:ring-2 focus:ring-vtop-accent focus:border-vtop-accent transition-all text-sm font-medium"
                            placeholder="e.g. Blue Leather Wallet">
                    </div>

                    <!-- Category Selection -->
                    <div>
                        <label for="categorySelect" class="block text-xs font-bold text-vtop-darkBlue uppercase tracking-wider mb-1">
                            Category <span class="text-rose-500">*</span>
                        </label>
                        <select id="categorySelect" required onchange="toggleCustomCategory(this.value)"
                            class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 bg-vtop-inputBg focus:bg-white focus:outline-none focus:ring-2 focus:ring-vtop-accent focus:border-vtop-accent transition-all text-sm font-medium">
                            <option value="" disabled selected>Select a category...</option>
                            <option value="Electronics">Electronics (Phone, Laptop, Headphones)</option>
                            <option value="Documents & Cards">Documents & Cards (ID, Passport, Wallet)</option>
                            <option value="Clothing & Accessories">Clothing & Accessories (Jacket, Glasses, Watch)</option>
                            <option value="Keys">Keys (House, Car, Office)</option>
                            <option value="Bags & Luggage">Bags & Luggage (Backpack, Suitcase)</option>
                            <option value="Jewelry">Jewelry & Valuables</option>
                            <option value="Books & Stationery">Books & Stationery</option>
                            <option value="Custom">Other (Custom)</option>
                        </select>
                    </div>

                    <!-- Custom Category Input (Hidden by default) -->
                    <div id="customCategoryContainer" class="hidden transition-all duration-300">
                        <label for="customCategory" class="block text-xs font-bold text-vtop-blue uppercase tracking-wider mb-1">
                            Specify Custom Category <span class="text-rose-500">*</span>
                        </label>
                        <input type="text" id="customCategory"
                            class="w-full px-3.5 py-2.5 rounded-xl border border-vtop-accent/50 bg-sky-50 focus:bg-white focus:outline-none focus:ring-2 focus:ring-vtop-accent transition-all text-sm font-medium"
                            placeholder="Enter unique item category...">
                    </div>

                    <!-- Date Lost & Location Lost Grid -->
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <div>
                            <label for="dateLost" class="block text-xs font-bold text-vtop-darkBlue uppercase tracking-wider mb-1">
                                Date Lost <span class="text-rose-500">*</span>
                            </label>
                            <input type="date" id="dateLost" required
                                class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 bg-vtop-inputBg focus:bg-white focus:outline-none focus:ring-2 focus:ring-vtop-accent focus:border-vtop-accent transition-all text-sm font-medium">
                        </div>
                        <div>
                            <label for="locationLost" class="block text-xs font-bold text-vtop-darkBlue uppercase tracking-wider mb-1">
                                Location Lost <span class="text-rose-500">*</span>
                            </label>
                            <input type="text" id="locationLost" required
                                class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 bg-vtop-inputBg focus:bg-white focus:outline-none focus:ring-2 focus:ring-vtop-accent focus:border-vtop-accent transition-all text-sm font-medium"
                                placeholder="e.g. Main Library">
                        </div>
                    </div>

                    
                    <!-- Feedback Message Container -->
                    <div id="statusMessage" class="hidden text-xs font-semibold p-3.5 rounded-xl border"></div>

                    <!-- Submit Button -->
                    <button type="submit"
                        class="w-full bg-vtop-blue hover:bg-vtop-darkBlue text-white font-bold py-3.5 px-4 rounded-xl shadow-md hover:shadow-lg transition-all duration-200 flex items-center justify-center gap-2">
                        <i class="fa-solid fa-paper-plane"></i>
                        Submit Lost Item Entry
                    </button>
                </form>
            </div>

            <!-- DISPLAY / RECORDS TABLE SECTION -->
            <div class="lg:col-span-7 space-y-4">
                <div class="vtop-card p-6 rounded-3xl flex flex-col sm:flex-row sm:items-center justify-between gap-4">
                    <div>
                        <h3 class="text-xl font-extrabold text-vtop-darkBlue flex items-center gap-2">
                            <i class="fa-solid fa-list-check text-vtop-accent"></i>
                            Recorded Entries
                        </h3>
                        <p class="text-slate-500 text-xs font-medium mt-0.5">List of registered missing items</p>
                    </div>
                    <div class="relative w-full sm:w-64">
                        <input type="text" id="searchInput" oninput="filterEntries()"
                            class="w-full pl-9 pr-3 py-2 text-xs rounded-xl border border-slate-300 bg-vtop-inputBg focus:bg-white focus:outline-none focus:ring-2 focus:ring-vtop-accent transition-all"
                            placeholder="Filter entries...">
                        <i class="fa-solid fa-search absolute left-3 top-2.5 text-slate-400 text-xs"></i>
                    </div>
                </div>

                <!-- Entries Table Card -->
                <div class="vtop-card rounded-3xl overflow-hidden">
                    <div class="overflow-x-auto">
                        <table class="w-full text-left text-xs text-slate-700">
                            <thead class="bg-slate-100 text-vtop-darkBlue font-bold uppercase tracking-wider text-[11px] border-b border-slate-200">
                                <tr>
                                    <th class="px-4 py-3.5">Item & Category</th>
                                    <th class="px-4 py-3.5">Date & Location</th>
                                    <th class="px-4 py-3.5">Contact</th>
                                    <th class="px-4 py-3.5 text-right">Action</th>
                                </tr>
                            </thead>
                            <tbody id="entriesTableBody" class="divide-y divide-slate-100 bg-white">
                                <!-- Dynamic entries will be rendered here -->
                            </tbody>
                        </table>
                    </div>

                    <!-- Empty State -->
                    <div id="emptyState" class="p-10 text-center text-slate-400 bg-white">
                        <i class="fa-solid fa-inbox text-4xl mb-3 text-slate-300"></i>
                        <p class="font-bold text-vtop-darkBlue text-sm">No lost item entries recorded yet.</p>
                        <p class="text-xs text-slate-400 mt-1">Submit the form to add entries to this list.</p>
                    </div>
                </div>
            </div>

        </div>
    </main>

    <script>
        // Storage array for lost items
        let lostItems = [];

        // Set max date for Date Lost input to today
        document.getElementById('dateLost').max = new Date().toISOString().split('T')[0];

        /**
         * Dynamic Category Select Handler
         * Displays or hides the custom category text input depending on dropdown selection
         */
        function toggleCustomCategory(selectedValue) {
            const customContainer = document.getElementById('customCategoryContainer');
            const customInput = document.getElementById('customCategory');

            if (selectedValue === 'Custom') {
                customContainer.classList.remove('hidden');
                customInput.setAttribute('required', 'required');
                customInput.focus();
            } else {
                customContainer.classList.add('hidden');
                customInput.removeAttribute('required');
                customInput.value = '';
            }
        }

        /**
         * Form Submission Handler
         */
        function handleFormSubmit(event) {
            event.preventDefault();

            const categorySelectValue = document.getElementById('categorySelect').value;
            const customCategoryValue = document.getElementById('customCategory').value.trim();

            // Determine final category string
            let finalCategory = categorySelectValue;
            let isCustom = false;

            if (categorySelectValue === 'Custom') {
                if (!customCategoryValue) {
                    showMessage('Please enter a custom category name.', 'error');
                    return;
                }
                finalCategory = customCategoryValue;
                isCustom = true;
            }

            // Construct new lost item object
            const newItem = {
                id: Date.now(),
                name: document.getElementById('itemName').value.trim(),
                category: finalCategory,
                isCustomCategory: isCustom,
                dateLost: document.getElementById('dateLost').value,
                locationLost: document.getElementById('locationLost').value.trim(),
                contactInfo: document.getElementById('contactInfo').value.trim(),
                description: document.getElementById('description').value.trim() || 'No additional details provided.',
                submittedAt: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
            };

            // Save item & Update UI
            lostItems.unshift(newItem);
            renderEntries();

            // Reset form
            document.getElementById('lostItemForm').reset();
            toggleCustomCategory('');

            // Display success feedback
            showMessage('Lost item entry registered successfully!', 'success');
        }

        /**
         * Render Table Entries
         */
        function renderEntries(itemsToRender = lostItems) {
            const tbody = document.getElementById('entriesTableBody');
            const emptyState = document.getElementById('emptyState');

            tbody.innerHTML = '';

            if (itemsToRender.length === 0) {
                emptyState.classList.remove('hidden');
                return;
            }

            emptyState.classList.add('hidden');

            itemsToRender.forEach(item => {
                const tr = document.createElement('tr');
                tr.className = 'hover:bg-slate-50 transition-colors';

                tr.innerHTML = `
                    <td class="px-4 py-3.5">
                        <div class="font-bold text-vtop-darkBlue">${escapeHtml(item.name)}</div>
                        <div class="text-[11px] flex items-center gap-1.5 mt-0.5">
                            <span class="inline-block px-2 py-0.5 rounded-md font-bold ${item.isCustomCategory ? 'bg-amber-100 text-amber-800' : 'bg-vtop-blue/10 text-vtop-blue'}">
                                ${escapeHtml(item.category)}
                            </span>
                        </div>
                        ${item.description ? `<p class="text-[11px] text-slate-500 mt-1 line-clamp-1">${escapeHtml(item.description)}</p>` : ''}
                    </td>
                    <td class="px-4 py-3.5">
                        <div class="text-slate-700 font-medium"><i class="fa-regular fa-calendar text-vtop-blue mr-1"></i>${item.dateLost}</div>
                        <div class="text-[11px] text-slate-500 mt-0.5"><i class="fa-solid fa-location-dot text-rose-500 mr-1"></i>${escapeHtml(item.locationLost)}</div>
                    </td>
                    <td class="px-4 py-3.5 text-slate-700 font-mono text-[11px]">
                        ${escapeHtml(item.contactInfo)}
                    </td>
                    <td class="px-4 py-3.5 text-right">
                        <button onclick="deleteEntry(${item.id})" class="text-slate-400 hover:text-rose-600 transition-colors p-1.5 rounded-lg hover:bg-rose-50" title="Delete Entry">
                            <i class="fa-solid fa-trash-can"></i>
                        </button>
                    </td>
                `;

                tbody.appendChild(tr);
            });
        }

        /**
         * Filter items by search text
         */
        function filterEntries() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = lostItems.filter(item => 
                item.name.toLowerCase().includes(query) ||
                item.category.toLowerCase().includes(query) ||
                item.locationLost.toLowerCase().includes(query) ||
                item.description.toLowerCase().includes(query)
            );
            renderEntries(filtered);
        }

        /**
         * Delete an entry
         */
        function deleteEntry(id) {
            lostItems = lostItems.filter(item => item.id !== id);
            filterEntries();
            showMessage('Entry removed.', 'info');
        }

        /**
         * Display Status Feedback Message
         */
        function showMessage(text, type) {
            const msgEl = document.getElementById('statusMessage');
            msgEl.textContent = text;
            msgEl.classList.remove('hidden', 'bg-emerald-50', 'text-emerald-800', 'border-emerald-200', 'bg-rose-50', 'text-rose-800', 'border-rose-200', 'bg-sky-50', 'text-sky-800', 'border-sky-200');

            if (type === 'success') {
                msgEl.classList.add('bg-emerald-50', 'text-emerald-800', 'border-emerald-200');
            } else if (type === 'error') {
                msgEl.classList.add('bg-rose-50', 'text-rose-800', 'border-rose-200');
            } else {
                msgEl.classList.add('bg-sky-50', 'text-sky-800', 'border-sky-200');
            }

            setTimeout(() => {
                msgEl.classList.add('hidden');
            }, 4000);
        }

        /**
         * Helper utility to prevent XSS
         */
        function escapeHtml(str) {
            return str.replace(/[&<>"']/g, function(m) {
                return {
                    '&': '&amp;',
                    '<': '&lt;',
                    '>': '&gt;',
                    '"': '&quot;',
                    "'": '&#039;'
                }[m];
            });
        }
    </script>
</body>
</html>
